name: Build VST3 (Windows)
on: [push, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target AmpForge_VST3 AmpForge_Standalone --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: AmpForge-win64
          path: build/AmpForge_artefacts/Release/
          
