name: Build VST3 (Windows)
on: [push, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix pointer types
        shell: pwsh
        run: |
          Get-ChildItem Source -Recurse -Filter *.h | ForEach-Object {
            $t = Get-Content $_.FullName -Raw
            $t = $t.Replace('float** d = ', 'float* const* d = ')
            Set-Content -Path $_.FullName -Value $t -NoNewline
          }
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target AmpForge_VST3 AmpForge_Standalone --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: AmpForge-win64
          path: build/AmpForge_artefacts/Release/
